# Tests every push (without the built data: the UI and backtest tests are skipped). When a
# stable release is published, the FULL suite runs on the built data first - and only if it
# passes does the `release` branch move to the release; doco-cd on the server follows that
# branch (see README, "Deploying"). A failed run never reaches the server, and GitHub emails
# you about it (Settings -> Notifications -> Actions).
name: test and release
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:          # run the full suite by hand (Actions tab -> Run workflow)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (undefined or unused names, imports, line length)
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - run: python -m pytest -q -p no:cacheprovider tests

  full:
    # the whole suite on the built data: before a release is deployed, or by hand
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Data version
        id: data
        run: echo "version=$(sed -n 's/^DATA_VERSION = "\(.*\)"/\1/p' econdata/version.py)" >> "$GITHUB_OUTPUT"
      # the built tables are kept between runs for each data version (as the server keeps
      # them until the version changes)
      - name: Restore the built data
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            econ_data
            !econ_data/.cache
            !econ_data/golden
            !econ_data/golden_app
          key: econ-data-v${{ steps.data.outputs.version }}
      # the downloads of the last build: a source that is down falls back to them, as on
      # the server (which keeps its download cache) - not to nothing (~1.5 GB)
      - name: Restore the download cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: econ_data/.cache
          key: econ-downloads-${{ github.run_id }}
          restore-keys: econ-downloads-
      - name: Build the data (~20-30 min; only for a new data version)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        # exit 2 = some sources fell back to cached or reference values: still usable
        run: python build_econ_dataset.py --out econ_data || [ $? -eq 2 ]
      - name: Keep the download cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: econ_data/.cache
          key: econ-downloads-${{ github.run_id }}
      - name: Keep the built data (even if a test fails below)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            econ_data
            !econ_data/.cache
            !econ_data/golden
            !econ_data/golden_app
          key: econ-data-v${{ steps.data.outputs.version }}
      - run: python -m pytest -q -p no:cacheprovider tests

  deploy:
    needs: [test, full]
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Point the release branch at the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          latest=$(gh release view --json tagName --jq .tagName)
          if [ "$latest" != "$TAG" ]; then
            echo "$TAG is not the latest release ($latest); leaving the release branch alone"
            exit 0
          fi
          git push --force origin "refs/tags/$TAG^{commit}:refs/heads/release"
