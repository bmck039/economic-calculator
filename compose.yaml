# Website mode: the app plus a Cloudflare Tunnel. Settings come from config.env.
#
#   docker compose up -d --build    start; both restart automatically whenever Docker runs
#   docker compose logs -f econ     watch the first-start data build (~10-20 min)
#   docker compose down             stop (the data volume is kept)
#
# On the server, doco-cd runs this file for you on every release (see README, "Deploying").
# It has no config.env in its copy of the repo, so .doco-cd.yml points ECON_CONFIG at one.
#
# Cloudflare dashboard -> your tunnel -> Public hostname: path `econ`,
# service type HTTP, URL `econ:8501`.
x-config: &config
  env_file:
    - path: ${ECON_CONFIG:-config.env}
      required: false

services:
  econ:
    build: .
    image: econ-calculator
    pull_policy: build              # built here, never pulled from a registry
    restart: unless-stopped
    init: true                      # clean signal handling and child reaping for PID 1
    <<: *config
    environment:                    # container-specific overrides of config.env
      HOST: 0.0.0.0
      PORT: "8501"
      OPEN_BROWSER: "false"
    volumes:
      - econ-data:/app/econ_data    # downloaded + derived data survives rebuilds
    # Uncomment to also reach it from this machine at http://localhost:8501/
    # ports: ["127.0.0.1:8501:8501"]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    <<: *config                     # cloudflared reads TUNNEL_TOKEN from it
    depends_on: [econ]

volumes:
  econ-data:
    name: econ-calculator-data      # the same volume whether doco-cd or you start the stack
